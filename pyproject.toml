[project]
name = "redulink-artifact"
version = "3.15"
description = "Reproducibility artifact for context-bound reference substitution over encrypted QUIC streams."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Michél Nguyen" }
]
dependencies = [
  "Pillow>=10",
  "python-docx>=1.1",
  "aioquic>=1.3",
  "matplotlib>=3.8",
  "pypdf>=6.10",
  "zstandard>=0.25"
]

[tool.redulink]
artifact_tag = "v3.15-journal-submission"
smoke_validation = "python3 scripts/run_smoke_validation.py"
full_validation = "python3 scripts/run_full_validation.py"
