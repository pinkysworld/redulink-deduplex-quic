name: submission-artifact-tests

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install dependencies and system baselines
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
          python -m pip install -r requirements-lock.txt
      - name: Fetch hash-pinned public corpora
        run: python benchmarks/fetch_external_public_corpora.py
      - name: Unit and manuscript validation
        run: python scripts/run_full_validation.py
      - name: Reproduce public object and rsync smoke outputs
        run: |
          python benchmarks/run_real_workload_manifest.py --manifest benchmarks/external_public_manifest.csv --output /tmp/external_public_suite.csv
          python benchmarks/run_external_object_workload_suite.py --output /tmp/external_object_workload_suite.csv
          python benchmarks/run_object_chunk_size_sensitivity.py --output-csv /tmp/object_chunk_size_sensitivity.csv --output-json /tmp/object_chunk_size_sensitivity.json
          python benchmarks/run_rsync_baseline_manifest.py --manifest benchmarks/external_public_manifest.csv --rounds 5 --output /tmp/rsync_baseline_external_public.csv
          python benchmarks/run_framing_dictionary_baseline.py --sets local --output /tmp/framing_dictionary_baseline.csv
          python benchmarks/run_pypi_version_pair_object_study.py --output-csv /tmp/pypi_version_pair_object_study.csv --output-json /tmp/pypi_version_pair_object_study.json
      - name: Reproduce native QUIC smoke outputs
        run: |
          python benchmarks/run_quic_flow_comparison.py --loss-every 0 --output-csv /tmp/quic_flow_comparison.csv --output-json /tmp/quic_flow_comparison.json
          python benchmarks/run_protocol_stream_accounting.py --source-csv /tmp/quic_flow_comparison.csv --output-csv /tmp/protocol_stream_byte_accounting.csv --output-json /tmp/protocol_stream_byte_accounting.json
          python benchmarks/run_aioquic_scaling_experiment.py --output-csv /tmp/aioquic_scaling_experiment.csv --output-json /tmp/aioquic_scaling_experiment.json
          python benchmarks/run_aioquic_workload_cases.py --output-csv /tmp/aioquic_workload_cases.csv --output-json /tmp/aioquic_workload_cases.json
          python benchmarks/run_quic_miss_rate_sensitivity.py --output-csv /tmp/quic_miss_rate_sensitivity.csv --output-json /tmp/quic_miss_rate_sensitivity.json
      - name: Compare regenerated evidence with committed results
        run: python scripts/check_submission_evidence.py --generated-dir /tmp
      - name: Smoke commands do not rewrite committed evidence
        run: git diff --exit-code
