name: isolated Linux netem evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/linux-netem-isolated.yml"
      - "benchmarks/run_linux_netem_quic_path.py"
      - "benchmarks/run_quic_flow_comparison.py"
      - "prototypes/redulink_aioquic_experiment.py"
      - "requirements-lock.txt"

permissions:
  contents: read

jobs:
  isolated-netem-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Python dependencies and Linux network tools
        run: |
          python -m pip install -r requirements-lock.txt
          sudo apt-get update
          sudo apt-get install --yes iproute2 util-linux
      - name: Fetch the hash-pinned external corpora
        run: python benchmarks/fetch_external_public_corpora.py
      - name: Run the isolated order-alternated sweep in a network namespace
        shell: bash
        run: |
          mkdir -p workflow-artifacts
          python_bin="$(command -v python)"
          if unshare --user --map-root-user --net true 2>/dev/null; then
            namespace=(unshare --user --map-root-user --net --mount-proc)
            namespace_mode="rootless-user-network"
          else
            namespace=(sudo unshare --net --mount-proc)
            namespace_mode="sudo-network"
          fi
          printf 'namespace_mode=%s\n' "$namespace_mode" | tee workflow-artifacts/workflow_environment.txt
          set +e
          # $1 is expanded by the inner namespace shell.
          # shellcheck disable=SC2016
          "${namespace[@]}" bash -euo pipefail -c '
            ip link set lo up
            exec "$1" benchmarks/run_linux_netem_quic_path.py \
              --no-sudo \
              --measurement-mode isolated \
              --payload demo redis \
              --rate-mbps 5 20 \
              --rtt-ms 20 \
              --loss-percent 0 \
              --rounds 20 \
              --output-json workflow-artifacts/linux_netem_quic_path_isolated.json \
              --output-csv workflow-artifacts/linux_netem_quic_path_isolated.csv
          ' bash "$python_bin" 2>&1 | tee -a workflow-artifacts/linux_netem_run.log
          status="${PIPESTATUS[0]}"
          sudo chown -R "$(id -u):$(id -g)" workflow-artifacts
          exit "$status"
      - name: Verify captured measurement mode and reconstruction
        run: |
          python -c 'import json, pathlib; p = json.loads(pathlib.Path("workflow-artifacts/linux_netem_quic_path_isolated.json").read_text()); assert p["measurement_mode"] == "isolated"; assert len(p["summary"]) == 4; assert all(row["all_reconstructed"] for row in p["summary"]); assert all(row["rounds"] == 20 for row in p["summary"])'
      - name: Upload raw Linux netem evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-netem-isolated-${{ github.sha }}
          path: workflow-artifacts/
          if-no-files-found: warn
          retention-days: 30
